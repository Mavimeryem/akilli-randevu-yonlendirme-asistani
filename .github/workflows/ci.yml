name: CI

# Her push ve pull request'te: derleme → migration/model uyumu → testler → kapsam raporu.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  derle-ve-test-et:
    name: Derle ve test et
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Kodu al
        uses: actions/checkout@v7

      - name: .NET 10 kur
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Bağımlılıkları yükle
        run: |
          dotnet restore
          dotnet tool restore

      - name: Derle
        run: dotnet build --no-restore -c Release

      - name: Migration ile model uyumlu mu?
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/AkilliRandevu.DataAccess
          --startup-project src/AkilliRandevu.Web
          --configuration Release --no-build

      - name: Testleri çalıştır
        run: >
          dotnet test --no-build -c Release
          --logger "GitHubActions"
          --logger "trx;LogFileName=test-sonuclari.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestSonuclari

      - name: Test sayıları
        if: always()
        run: |
          f=$(find TestSonuclari -name 'test-sonuclari.trx' | head -1)
          if [ -n "$f" ]; then
            sayac=$(grep -o '<Counters [^>]*>' "$f" | sed 's/<Counters //; s/>//')
            echo "::notice title=Test sonucu::$sayac"
          fi

      - name: Kapsam raporu
        if: always()
        run: |
          dotnet reportgenerator \
            -reports:"TestSonuclari/**/coverage.cobertura.xml" \
            -targetdir:TestSonuclari/kapsam \
            -reporttypes:"MarkdownSummaryGithub;TextSummary;Html" \
            -assemblyfilters:"-AkilliRandevu.Tests" \
            -classfilters:"-AkilliRandevu.DataAccess.Migrations.*;-AspNetCoreGeneratedDocument.*"
          cat TestSonuclari/kapsam/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          satir=$(grep -m1 "Line coverage" TestSonuclari/kapsam/Summary.txt | awk '{print $3}')
          dal=$(grep -m1 "Branch coverage" TestSonuclari/kapsam/Summary.txt | awk '{print $3}')
          echo "::notice title=Kod kapsamı::Satır $satir · dal $dal"
          grep -E "^AkilliRandevu\.(Business|DataAccess|Web|Entities) " TestSonuclari/kapsam/Summary.txt | while read -r satir; do
            echo "::notice title=Kapsam (proje)::$satir"
          done

      - name: Test ve kapsam sonuçlarını sakla
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-sonuclari
          path: TestSonuclari
          if-no-files-found: ignore

  # Dağıtım hazırlığı: Docker imajı temiz bir ortamda derlenip çalıştırılıyor mu?
  docker:
    name: Docker imajı
    needs: derle-ve-test-et
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Kodu al
        uses: actions/checkout@v7

      - name: İmajı derle
        run: docker build -t akilli-randevu:ci .

      - name: Konteyneri başlat ve sağlık kontrolü
        run: |
          docker run -d --name uygulama -p 8080:8080 -e DemoModu=true akilli-randevu:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/saglik > /dev/null; then echo "Uygulama $i saniyede ayağa kalktı"; break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/saglik

      - name: Duman testi (canlı ortam ayarlarıyla)
        run: |
          set -e
          h='-H X-Forwarded-Proto:https'
          kod() { curl -s -o /dev/null -w '%{http_code}' $h "http://localhost:8080$1"; }
          test "$(kod /)" = 200
          test "$(kod /Hesap/Giris)" = 200
          test "$(kod /Home/Gizlilik)" = 200
          test "$(kod /olmayan-sayfa)" = 404
          test "$(kod /Hasta/Randevularim)" = 302
          curl -s $h http://localhost:8080/ | grep -q "Demo sürümü" || curl -s $h http://localhost:8080/ | grep -q "Demo s&#xFC;r&#xFC;m&#xFC;"
          echo "::notice title=Docker::İmaj derlendi, konteyner çalıştı, sayfalar doğru durum kodlarını döndürdü"

      - name: Konteyner günlükleri
        if: always()
        run: docker logs uygulama 2>&1 | tail -n 60
