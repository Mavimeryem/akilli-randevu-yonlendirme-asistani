name: CI

# Her push ve pull request'te: derleme → migration/model uyumu → testler (+ kapsam raporu).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  derle-ve-test-et:
    name: Derle ve test et
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: .NET 10 kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bağımlılıkları yükle
        run: |
          dotnet restore
          dotnet tool restore

      - name: Derle
        run: dotnet build --no-restore -c Release

      - name: Migration ile model uyumlu mu?
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/AkilliRandevu.DataAccess
          --startup-project src/AkilliRandevu.Web
          --configuration Release --no-build

      - name: Testleri çalıştır
        run: >
          dotnet test --no-build -c Release
          --logger "GitHubActions"
          --logger "trx;LogFileName=test-sonuclari.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestSonuclari

      - name: Test sonuçlarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-sonuclari
          path: TestSonuclari
          if-no-files-found: ignore
